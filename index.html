<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Caveat:wght@600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <title>Re-born · 발화 재활 트레이닝</title>
    <script>
      // React가 붙기 전에 테마부터 정해야 다크모드에서 화면이 잠깐 밝게 번쩍이지 않음
      // (src/lib/theme.ts의 getInitialTheme/applyTheme과 같은 로직 — 모듈 로드를
      // 기다릴 수 없어서 여기 인라인으로 중복)
      (function () {
        try {
          var stored = localStorage.getItem('rb.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* private mode 등 — 기본(라이트)으로 둠 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
