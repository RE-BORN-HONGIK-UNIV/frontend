[build]
  command = "npm run build"
  publish = "dist"

# react-router의 클라이언트 사이드 라우팅 — /login, /voice 같은 경로로
# 직접 접속하거나 새로고침해도 index.html로 떨어지게 함(안 하면 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 백엔드가 Render 무료 티어(https://reborn-backend-vgsi.onrender.com)에 배포됨
# (2026-09). mock API는 껐고 실제 백엔드를 바라보게 설정.
[build.environment]
  VITE_API_BASE_URL = "https://reborn-backend-vgsi.onrender.com"
